name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Test browser logic
        run: |
          if [ -d web ]; then
            node --test web/
          else
            echo "web/ not present yet; skipping browser tests"
          fi
